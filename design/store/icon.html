<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 512px; height: 512px; overflow: hidden; }
  .wrap {
    width: 512px; height: 512px; position: relative;
    background:
      radial-gradient(circle at 50% 40%, #3a2a18 0%, #241a0f 55%, #140e07 100%);
    display: flex; align-items: center; justify-content: center;
  }
  .spool {
    width: 400px; height: 400px; border-radius: 50%;
    box-shadow: 0 0 60px rgba(0,0,0,0.6), 0 0 0 6px #6b4a24, 0 0 0 14px #2e2012;
    overflow: hidden;
  }
  .spool img { width: 100%; height: 100%; display: block; }
  .glow {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 38%, rgba(255,196,110,0.18) 0%, rgba(255,196,110,0) 60%);
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="spool"><img src="../../public/assets/images/tape_spool_assembly.png" alt=""></div>
    <div class="glow"></div>
  </div>
</body>
</html>
